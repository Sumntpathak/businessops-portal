services:
  web:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped
    init: true

  voice:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped
    init: true

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - voice

volumes:
  caddy_data:
  caddy_config:
