[general]
static=yes
writeprotect=no

[globals]
AZURE_PROJECT=proj_a42a10bffffe4180b7d29ae431cc20c1
TWILIO_CALLERID=+12182768292
TRANSFER_CALLERID=61370761437

; ---- a caller arrives from VoIPline: hand the call to the AI ----
[from-voipline]
exten => _X.,1,NoOp(VoIPline call to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(DID=${EXTEN})
 same => n,Set(CID=${CALLERID(num)})
; The voice server wants the caller as +E.164 and VoIPline sends digits.
 same => n,GotoIf($["${CID:0:1}" = "+"]?cid_done)
 same => n,GotoIf($["${CID:0:2}" = "00"]?cid_intl)
 same => n,GotoIf($["${CID:0:1}" = "0"]?cid_national)
 same => n,Set(CID=+${CID})
 same => n,Goto(cid_done)
 same => n(cid_intl),Set(CID=+${CID:2})
 same => n,Goto(cid_done)
 same => n(cid_national),Set(CID=+61${CID:1})
 same => n(cid_done),Set(CALLERID(num)=${CID})
 same => n,Dial(PJSIP/${AZURE_PROJECT}@azure,45,b(add-called-header^s^1(${DID})))
 same => n,NoOp(Azure leg ended: ${DIALSTATUS})
 same => n,Hangup()

; Tells the voice server which number was dialled (it looks the business up by this).
[add-called-header]
exten => s,1,Set(PJSIP_HEADER(add,X-Called)=+${ARG1})
 same => n,Return()

; ---- Azure asks for a transfer (REFER): transfer the caller ----
[from-azure]
exten => _+X.,1,NoOp(Transfer requested to ${EXTEN} for caller ${CALLERID(num)})
 ; 1. First attempt: Ask VoIPline PBX to transfer the caller directly (SIP REFER)
 same => n,NoOp(Attempting native SIP REFER to VoIPline for ${EXTEN})
 same => n,Transfer(PJSIP/${EXTEN})
 same => n,NoOp(VoIPline transfer status: ${TRANSFERSTATUS} code ${TRANSFERSTATUSPROTOCOL})
 same => n,GotoIf($["${TRANSFERSTATUS}" = "SUCCESS"]?transfer_done)
 ; 2. Second attempt: Try national format (04...) if destination is Australian
 same => n,GotoIf($["${EXTEN:0:3}" != "+61"]?try_twilio)
 same => n,NoOp(Attempting native SIP REFER to VoIPline with national format 0${EXTEN:3})
 same => n,Transfer(PJSIP/0${EXTEN:3})
 same => n,NoOp(VoIPline national transfer status: ${TRANSFERSTATUS} code ${TRANSFERSTATUSPROTOCOL})
 same => n,GotoIf($["${TRANSFERSTATUS}" = "SUCCESS"]?transfer_done)
 ; 3. Third attempt: Route through Twilio Elastic SIP Trunk
 same => n(try_twilio),NoOp(Falling back to Twilio outbound dial for ${EXTEN})
 same => n,Set(CALLERID(num)=${TWILIO_CALLERID})
 same => n,Set(CALLERID(name)=Holistic)
 same => n,NoOp(Dialing staff via Twilio to ${EXTEN} with caller id ${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN}@twilio,60)
 same => n,NoOp(Twilio transfer leg ended: ${DIALSTATUS})
 same => n(transfer_done),Hangup()
exten => _X.,1,Goto(+${EXTEN},1)
