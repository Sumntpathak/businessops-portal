; Recepto relay: VoIPline (plain SIP) <-> Azure OpenAI Realtime (SIP over TLS + SRTP).

[global]
type=global
user_agent=Recepto-Relay

; ---- transports ----
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; Outbound only (port 5062 is not opened in the firewall).
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5062
method=tlsv1_2
cert_file=/etc/asterisk/keys/relay.crt
priv_key_file=/etc/asterisk/keys/relay.key
ca_list_file=/etc/ssl/certs/ca-certificates.crt
verify_server=yes
verify_client=no

; ---- Azure OpenAI Realtime (outbound) ----
[azure]
type=endpoint
transport=transport-tls
context=from-azure
disallow=all
allow=ulaw
media_encryption=sdes
media_encryption_optimistic=no
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
allow_transfer=yes
dtmf_mode=rfc4733
aors=azure

[azure]
type=aor
contact=sip:eastus2.sip.ai.azure.com:5061;transport=tls

; ---- VoIPline (inbound calls and outbound transfers) ----
[voipline]
type=endpoint
transport=transport-udp
context=from-voipline
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
dtmf_mode=rfc4733
allow_transfer=yes
from_domain=sip.voipcloud.online
aors=voipline

; Where transfers are sent. Port and number format must be confirmed with VoIPline.
[voipline]
type=aor
contact=sip:103.242.182.14:7060

[voipline]
type=identify
endpoint=voipline
match=103.242.182.14

; ---- Twilio Elastic SIP Trunk (outbound transfers to staff) ----
[twilio]
type=endpoint
transport=transport-udp
context=from-twilio
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
dtmf_mode=rfc4733
from_domain=recepto-relay.pstn.twilio.com
aors=twilio

[twilio]
type=aor
contact=sip:recepto-relay.pstn.twilio.com:5060

[twilio]
type=identify
endpoint=twilio
match=recepto-relay.pstn.twilio.com
